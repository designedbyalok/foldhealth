name: Changelog

# On every push to main, inserts one changelog_entries row per qualifying
# commit into Supabase: this feeds the in-app Help → "What's New" drawer
# (src/components/WhatsNewDrawer). Mapping mirrors the backfill in
# supabase/changelog_migration.sql's runner:
#   feat → New · fix → Fixed · perf/refactor/style → Improved
#   chore/docs/test/ci/build and merge commits are skipped.
# The sha column is UNIQUE, so re-runs and force-pushes can't duplicate rows.
#
# Requires the SUPABASE_SERVICE_ROLE_KEY repo secret. When it's missing the
# job skips quietly instead of failing the push.

on:
  push:
    branches: [main]

jobs:
  changelog:
    name: Publish changelog entries
    runs-on: ubuntu-latest
    steps:
      - name: Insert entries into Supabase
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
          COMPARE_URL: ${{ github.event.compare }}
        run: |
          python3 - << 'EOF'
          import json, os, re, sys, urllib.request

          key = os.environ.get("SERVICE_ROLE_KEY", "").strip()
          if not key:
              print("SUPABASE_SERVICE_ROLE_KEY secret not set: skipping.")
              sys.exit(0)

          KIND = {"feat": "New", "fix": "Fixed", "perf": "Improved",
                  "refactor": "Improved", "style": "Improved"}
          compare = os.environ.get("COMPARE_URL") or None

          rows = []
          for c in json.loads(os.environ.get("COMMITS_JSON") or "[]"):
              subject = (c.get("message") or "").split("\n")[0].strip()
              if not subject or subject.startswith("Merge "):
                  continue
              m = re.match(r"^(\w+)(?:\([^)]*\))?!?:\s*(.+)$", subject)
              if m and m.group(1) not in KIND:
                  continue  # chore/docs/test/ci/build: not user-facing
              title = (m.group(2) if m else subject)
              rows.append({
                  "title": title[:1].upper() + title[1:],
                  "kind": KIND[m.group(1)] if m else "New",
                  "sha": c.get("id"),
                  "compare_url": compare,
                  "created_at": c.get("timestamp"),
              })
          if not rows:
              print("No user-facing commits in this push, nothing to publish.")
              sys.exit(0)

          req = urllib.request.Request(
              "https://osnihfqqrcchsaqhagcx.supabase.co/rest/v1/changelog_entries?on_conflict=sha",
              data=json.dumps(rows).encode(),
              headers={
                  "apikey": key,
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
                  "Prefer": "resolution=ignore-duplicates",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as r:
                  print(f"Inserted {len(rows)} entries (HTTP {r.status}).")
          except urllib.error.HTTPError as e:
              # Surface the error but never fail the push pipeline.
              print("Supabase error:", e.code, e.read().decode()[:400])
              sys.exit(0)
          EOF
