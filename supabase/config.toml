# Supabase project config — source of truth for `supabase config push`.
#
# ⚠️  IMPORTANT: `supabase config push` pushes the FULL auth config — any
# field NOT declared here gets reset to the CLI default on the remote.
# Every remote setting that differs from CLI defaults MUST be declared in
# this file. (Learned the hard way: a minimal config wiped site_url etc.)
#
# The email templates use token-hash links pointing at OUR domain (Site URL)
# instead of the default {{ .ConfirmationURL }} (*.supabase.co), because:
#   1. corporate firewalls block *.supabase.co links outright, and
#   2. mail-security scanners prefetch links, consuming one-time verify
#      tokens — with token_hash links the token is only redeemed when the
#      user submits the Set Password form (see ResetPasswordPage.jsx).
#
# ── If you ever re-enable Supabase Branching, read this first ──────────────
# Branching applies everything at the ROOT of this file to the ephemeral
# preview database it creates per PR. Those branches are FREE TIER, so the
# two [auth.email.template.*] blocks below fail the whole "Supabase Preview"
# check with:
#   400 "Email template modification is not available for free tier projects
#        using the default email provider."
# That failed every PR that touched supabase/ until branching was turned off
# (see PRs #179/#181/#184/#185). The fix is to move paid-tier-only settings
# under a [remotes.production] block, which targets the production project
# ref only — but verify afterwards that `supabase config push` still applies
# them to production, since the CLI's merge order for [remotes] is not
# documented and a miss would silently reset these templates to defaults.
#
# Branching also needs a real supabase/migrations/ history, which this repo
# has never had (the *_migration.sql files here are applied by hand, and the
# older HCC ones were deleted in bbd82ef). Without it the preview branch
# replays an incomplete history and dies on a missing relation.

project_id = "osnihfqqrcchsaqhagcx"

# CLI default is enabled=true, but vector buckets are a paid-tier feature —
# without this override every push 402s on the Storage step (free tier).
[storage.vector]
enabled = false

[auth]
site_url = "https://foldhealth.org/"
additional_redirect_urls = [
  "https://foldhealth.org/",
  "https://foldhealth.org/**",
  "https://foldhealth-alokfold.vercel.app/",
  "https://foldhealth-alokfold.vercel.app/**",
  "https://foldhealth-*-alokfold.vercel.app",
  "https://foldhealth-*-alokfold.vercel.app/**",
]

[auth.rate_limit]
sign_in_sign_ups = 100

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.email.template.recovery]
subject = "Reset Your Foldhealth Password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.confirmation]
subject = "Confirm Your Signup"
content_path = "./supabase/templates/confirmation.html"
