    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin>
    <script>
      // Apply theme BEFORE first paint to prevent flash-of-wrong-theme.
      // Default is 'light', system preference is honored only if the user
      // has explicitly chosen 'system' in the in-app theme picker.
      (function () {
        // Keep this list in sync with THEME_VALUES in src/lib/theme.js.
        // 'system' is resolved to 'light' or 'dark' at startup; every other
        // value is passed through as-is (e.g. 'blue' → data-theme="blue").
        var VALID = ['light', 'dark', 'blue', 'plum', 'system'];
        try {
          var stored = localStorage.getItem('theme') || 'light';
          if (VALID.indexOf(stored) === -1) stored = 'light';
          var resolved = stored;
          if (stored === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          }
          // High-contrast attribute, applied pre-paint too so muted rungs of
          // the neutral scale don't flash their default values on refresh.
          var contrast = localStorage.getItem('contrast');
          if (contrast === 'high') {
            document.documentElement.setAttribute('data-contrast', 'high');
          }
          // Font-scale: set the root font-size level pre-paint so text
          // doesn't flash at default size before the store hydrates.
          var FONT_SCALES = ['smaller', 'small', 'large', 'larger'];
          var fontScale = localStorage.getItem('fontScale');
          if (fontScale && FONT_SCALES.indexOf(fontScale) !== -1) {
            document.documentElement.setAttribute('data-font-scale', fontScale);
          }
        } catch (e) {
          // localStorage unavailable (private mode, etc.), fall back to light.
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
